<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAVAKUL — прототип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--bg:#102D27;--card:#173E34;--ink:#F3EFE5;--muted:#A9B3AC;--gold:#C8AE7B;--line:rgba(200,174,123,.28);--on-gold:#102D27;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=sand]{--bg:#F3EFE5;--card:#FFFFFF;--ink:#173E34;--muted:#5C6962;--gold:#8A6F3A;--line:rgba(138,111,58,.3);--on-gold:#FFFFFF;color-scheme:light}
[data-theme=night]{--bg:#050505;--card:#141210;--ink:#F3EFE5;--muted:#A39C8E;--gold:#C8AE7B;--line:rgba(200,174,123,.3);--on-gold:#050505}
[data-theme=midnight]{--bg:#0E1A33;--card:#16264B;--ink:#EAF0FA;--muted:#9FADC8;--gold:#C8AE7B;--line:rgba(200,174,123,.3);--on-gold:#0E1A33}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;display:flex;flex-direction:column;transition:background .3s}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0;line-height:1.15}
main{flex:1;overflow-y:auto;padding:20px 18px 24px;max-width:520px;width:100%;margin:0 auto}
.ar{font-family:Amiri,'Traditional Arabic',serif;direction:rtl}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.muted{color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:var(--gold);color:var(--on-gold);font-weight:700;border-radius:14px;padding:14px 18px;width:100%}
.ghost{border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:14px}
.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;font-size:14px;font-weight:500}
.tile b{display:block;font-family:Amiri,serif;font-size:26px;color:var(--gold);font-weight:400;line-height:1.3}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 22px 70px;background:linear-gradient(160deg,var(--card),var(--bg));border:1px solid var(--line)}
.hero h1{font-size:34px}
.hero svg{position:absolute;right:-10px;bottom:-4px;width:240px;opacity:.55}
.bar{height:8px;border-radius:8px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .4s}
.big{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:700;color:var(--gold);line-height:1}
.rosary{display:block;width:100%;max-width:330px;margin:10px auto 4px;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rosary svg{width:100%;height:auto;display:block}
#beads{transform-box:view-box;transform-origin:150px 150px;transition:transform .22s cubic-bezier(.3,.8,.3,1)}
.bd{fill:var(--card);stroke:var(--gold);stroke-width:1.5;transition:fill .15s}
.bd.c{fill:var(--gold)}
.tap{position:absolute;inset:22px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .08s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tap:active{transform:scale(.96)}
.tap span{font-family:'Cormorant Garamond',serif;font-size:64px;font-weight:700;line-height:1}
.row-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.row-item:last-child{border:0}
input[type=number]{width:96px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg)}
nav button{flex:1;padding:10px 0 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{background:none;color:var(--gold);font-weight:700}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--gold);color:var(--on-gold);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center;z-index:5}
#toast.show{opacity:1;transform:translate(-50%,0)}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px}
.sw i{width:26px;height:26px;border-radius:50%;border:2px solid var(--gold)}
.note{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="v"></main>
<nav id="nav" aria-label="Разделы"></nav>
<div id="toast" role="status"></div>
<script>
var Z=[
{id:'sub',ar:'سُبْحَانَ ٱللَّٰهِ',tr:'СубханАллах',ru:'Преславен Аллах',cat:'Тасбих, тахмид и такбир'},
{id:'hamd',ar:'ٱلْحَمْدُ لِلَّٰهِ',tr:'Альхамдулилля',ru:'Хвала Аллаху',cat:'Тасбих, тахмид и такбир'},
{id:'akb',ar:'ٱللَّٰهُ أَكْبَرُ',tr:'Аллаху Акбар',ru:'Аллах превелик',cat:'Тасбих, тахмид и такбир'}];
var TABS=[['home','Главная','M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10'],['zikr','Зикр','M12 3a9 9 0 100 18 9 9 0 000-18zM12 8v4l3 2'],['know','Знания','M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2zM4 19V5'],['help','Помощь','M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z'],['me','Профиль','M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0']];
var THEMES=[['emerald','Emerald','#102D27'],['sand','Sand','#F3EFE5'],['night','Night','#050505'],['midnight','Midnight','#0E1A33']];
function def(){return{tab:'home',theme:matchMedia('(prefers-color-scheme: light)').matches?'sand':'emerald',vib:true,snd:true,zi:0,counts:{},target:33,paused:false,fav:{},today:0,day:new Date().toDateString(),hist:[],amt:500,dir:'project',conf:false}}
function load(){var s=def();try{Object.assign(s,JSON.parse(localStorage.getItem('tvk')||'{}'))}catch(e){}if(s.day!==new Date().toDateString()){s.day=new Date().toDateString();s.today=0}s.tab='home';s.conf=false;return s}
var S=load();
function save(){try{localStorage.setItem('tvk',JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function toast(m){var t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},2600)}
function buzz(n){if(S.vib&&navigator.vibrate){try{navigator.vibrate(n)}catch(e){}}}
function go(t){S.tab=t;S.conf=false;render();$('v').scrollTop=0}
function cur(){return Z[S.zi]}
function cnt(){return S.counts[cur().id]||0}
var AC;
function snd(big){if(!S.snd)return;try{var a=AC||(AC=new(window.AudioContext||window.webkitAudioContext)());if(a.state==='suspended')a.resume();var t=a.currentTime,o=a.createOscillator(),g=a.createGain(),d=big?.45:.1;o.type='triangle';o.frequency.setValueAtTime(big?880:360,t);o.frequency.exponentialRampToValueAtTime(big?440:130,t+(big?.3:.07));g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function rosary(n){var B=Math.min(33,S.target),st=360/B,m=n%B,s='<path d="M144 12h12l-6 10z" fill="var(--gold)"/><g id="beads" style="transform:rotate('+(-n*st)+'deg)">';for(var i=0;i<B;i++){var a=(i*st-90)*Math.PI/180;s+='<circle class="bd'+(i<m?' c':'')+'" cx="'+(150+118*Math.cos(a)).toFixed(1)+'" cy="'+(150+118*Math.sin(a)).toFixed(1)+'" r="8"/>'}
s+='</g><circle cx="150" cy="274" r="11" fill="var(--gold)"/><path d="M150 285v16M150 301l-9 40M150 301l-3 42M150 301v44M150 301l3 42M150 301l9 40" stroke="var(--gold)" stroke-width="2" fill="none" stroke-linecap="round"/>';
s+='<text id="num" x="150" y="166" text-anchor="middle" style="font:700 64px \'Cormorant Garamond\',serif;fill:var(--gold)">'+n+'</text><text x="150" y="194" text-anchor="middle" style="font:14px Manrope,sans-serif;fill:var(--muted)">из '+S.target+'</text>';return s}
function view(){
var z=cur(),n=cnt(),goal=100,pct=Math.min(100,Math.round(S.today/goal*100)),h='';
if(S.tab==='home'){
var d=Z[new Date().getDate()%Z.length];
h='<div class="hero"><h1>Ассаляму алейкум</h1><p class="muted" style="margin:8px 0 0;max-width:230px">Ближе к вере. Каждый день.</p>'+
'<svg viewBox="0 0 240 110" fill="none" stroke="var(--gold)" stroke-width="1.4"><path d="M30 110V70h30v40M45 70V30M45 30l-4 8h8zM80 110V78c0-26 20-38 40-52 20 14 40 26 40 52v32M120 26V12M175 110V62h24v48M187 62V36M187 36l-3 6h6z"/><path d="M120 12l-3 5h6z"/></svg></div>'+
'<div class="card"><div class="muted">Сегодня прочитано</div><div class="row" style="justify-content:space-between;align-items:baseline"><span class="big">'+S.today+'</span><span class="muted">цель: '+goal+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
'<button class="btn" style="margin-top:14px" onclick="go(\'zikr\')">Продолжить: '+z.tr+' · '+n+'/'+S.target+'</button>'+
'<div class="grid3"><button class="tile" onclick="go(\'zikr\')"><b>٣٣</b>Тасбих</button><button class="tile" onclick="go(\'know\')"><b>٩٩</b>Имена</button><button class="tile" onclick="go(\'know\')"><b>علم</b>Знания</button></div>'+
'<div class="card"><div class="muted">Зикр дня (демо)</div><div class="ar" style="font-size:30px;text-align:center;margin:8px 0;color:var(--gold)">'+d.ar+'</div><div style="text-align:center">'+d.tr+' — '+d.ru+'</div></div>'+
'<div class="card"><h3>Помощь проекту</h3><p class="muted" style="margin:6px 0 12px">Поддержать развитие TAVAKUL или помочь нуждающимся.</p><button class="ghost" onclick="go(\'help\')">Открыть раздел</button></div>';
}else if(S.tab==='zikr'){
h='<div class="muted">'+z.cat+'</div><div class="ar" style="font-size:44px;text-align:center;margin-top:10px;color:var(--gold)">'+z.ar+'</div><h2 style="text-align:center">'+z.tr+'</h2><div class="muted" style="text-align:center">'+z.ru+'</div>'+
'<button class="rosary" onclick="tap()" aria-label="Прибавить повторение"><svg viewBox="0 0 300 350">'+rosary(n)+'</svg></button>'+
'<div class="muted" style="text-align:center;margin-bottom:12px">Нажимайте на чётки'+(S.paused?' · пауза':'')+'</div>'+
'<div class="row" style="justify-content:center;margin-bottom:10px">'+[33,99,100].map(function(v){return '<button class="ghost'+(S.target===v?' on':'')+'" onclick="setT('+v+')">'+v+'</button>'}).join('')+'<input type="number" min="1" max="100000" placeholder="своё" aria-label="Своё количество" onchange="setT(+this.value)"></div>'+
'<div class="row" style="justify-content:center">'+
'<button class="ghost'+(S.paused?' on':'')+'" onclick="S.paused=!S.paused;save();render()">'+(S.paused?'Продолжить':'Пауза')+'</button>'+
'<button class="ghost'+(S.vib?' on':'')+'" onclick="S.vib=!S.vib;save();render()">Вибрация: '+(S.vib?'вкл':'выкл')+'</button>'+
'<button class="ghost'+(S.snd?' on':'')+'" onclick="S.snd=!S.snd;save();render()">Звук: '+(S.snd?'вкл':'выкл')+'</button>'+'<button class="ghost'+(S.fav[z.id]?' on':'')+'" onclick="fav(\''+z.id+'\')">'+(S.fav[z.id]?'В избранном':'В избранное')+'</button>'+
(S.conf?'<button class="ghost" onclick="reset(true)">Да, сбросить</button><button class="ghost" onclick="reset(false)">Отмена</button>':'<button class="ghost" onclick="reset()">Сброс</button>')+'</div>'+
'<div class="card"><h3>Зикры</h3>'+Z.map(function(x,i){return '<button class="row-item" onclick="pick('+i+')"><span><b>'+x.tr+'</b><br><span class="muted">'+x.ru+'</span></span><span class="muted">'+(S.counts[x.id]||0)+'/'+S.target+(i===S.zi?' ●':'')+'</span></button>'}).join('')+'</div>'+
'<div class="note">Демо-набор. Значение, источник и рекомендуемое число повторений будут добавлены только после проверки по достоверным источникам.</div>';
}else if(S.tab==='know'){
h='<h1>Знания</h1><div class="note" style="margin-top:12px">Демо-раздел. Материалы появятся после добавления проверенных источников через админ-панель.</div>'+
'<div class="card"><h3>99 прекрасных имён Аллаха</h3><p class="muted" style="margin:6px 0 12px">Сетка карточек, значения и источники.</p><button class="ghost" onclick="toast(\'Пока пусто: имена добавляются через админ-панель\')">Открыть</button></div>'+
'<div class="card">'+['Основы ислама','Коран','Хадисы','Дуа','Сунна','Исламская история','Полезные материалы'].map(function(c){return '<button class="row-item" onclick="toast(\'В разделе «'+c+'» пока нет материалов\')"><span>'+c+'</span><span class="muted">пока пусто</span></button>'}).join('')+'</div>';
}else if(S.tab==='help'){
h='<h1>Пожертвование</h1>'+
'<div class="card"><p style="margin:0">Один взнос идёт сразу на два направления: развитие TAVAKUL и помощь нуждающимся. Пропорции и отчёты о переводах будут публиковаться здесь.</p></div>'+
'<div class="card"><div class="muted">Сумма, ₽</div><div class="row" style="margin-top:8px">'+[300,500,1000].map(function(v){return '<button class="ghost'+(S.amt===v?' on':'')+'" onclick="S.amt='+v+';save();render()">'+v+'</button>'}).join('')+'<input type="number" min="10" placeholder="своя" aria-label="Своя сумма" onchange="S.amt=+this.value;save()"></div></div>'+
'<button class="btn" style="margin-top:14px" onclick="toast(\'Оплата не подключена: нужны ЮKassa и серверная часть\')">Перейти к оплате</button>'+
'<div class="card"><h3>История пожертвований</h3><p class="muted" style="margin:6px 0 0">Пока пусто. Записи появятся после подтверждения платежа сервером.</p></div>';
}else{
var tot=S.hist.length,fz=Z.filter(function(x){return S.fav[x.id]});
h='<div class="row" style="gap:14px"><div class="ar" style="width:60px;height:60px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--gold)">ت</div><div><h2>Гость</h2><div class="muted">Вход через Telegram появится после подключения сервера</div></div></div>'+
'<div class="grid3"><div class="tile"><span class="big" style="font-size:30px">'+S.today+'</span><br>сегодня</div><div class="tile"><span class="big" style="font-size:30px">'+tot+'</span><br>кругов</div><div class="tile"><span class="big" style="font-size:30px">'+fz.length+'</span><br>избранное</div></div>'+
'<div class="card"><h3 style="margin-bottom:12px">Тема</h3><div class="themes">'+THEMES.map(function(t){return '<button class="sw'+(S.theme===t[0]?' on':'')+'" onclick="theme(\''+t[0]+'\')"><i style="background:'+t[2]+'"></i>'+t[1]+'</button>'}).join('')+'</div></div>'+
'<div class="card"><h3>Избранные зикры</h3>'+(fz.length?fz.map(function(x){return '<div class="row-item"><span>'+x.tr+'</span><span class="ar" style="color:var(--gold)">'+x.ar+'</span></div>'}).join(''):'<p class="muted" style="margin:6px 0 0">Пока пусто. Нажмите «В избранное» в разделе «Зикр».</p>')+'</div>';
}
return h}
function render(){
document.documentElement.setAttribute('data-theme',S.theme);
$('v').innerHTML=view();
$('nav').innerHTML=TABS.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"'+(S.tab===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24"><path d="'+t[2]+'"/></svg>'+t[1]+'</button>'}).join('')}
function tap(){
if(S.paused){toast('Пауза: нажмите «Продолжить»');return}
var z=cur(),n=(S.counts[z.id]||0)+1;S.today++;
if(n>=S.target){S.hist.push({id:z.id,n:S.target,t:Date.now()});S.counts[z.id]=0;buzz([40,60,40]);snd(true);
S.zi=(S.zi+1)%Z.length;save();toast('Готово. Далее: '+cur().tr);render();return}
S.counts[z.id]=n;buzz(12);save();
$('num').textContent=n;var B=Math.min(33,S.target),m=n%B,b=document.querySelectorAll('.bd');$('beads').style.transform='rotate('+(-n*360/B)+'deg)';for(var i=0;i<b.length;i++)b[i].setAttribute('class','bd'+(i<m?' c':''));snd(false)}
function setT(v){if(!(v>0)){toast('Введите число больше нуля');return}S.target=Math.min(100000,Math.floor(v));S.counts[cur().id]=Math.min(cnt(),S.target-1);save();render()}
function pick(i){S.zi=i;save();render()}
function fav(id){S.fav[id]=!S.fav[id];save();render()}
function reset(c){if(c===undefined){S.conf=true}else{S.conf=false;if(c){S.counts[cur().id]=0;toast('Счётчик сброшен')}}save();render()}
function theme(t){S.theme=t;save();render()}
render();
</script>
</body>
</html>
